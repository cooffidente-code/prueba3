<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Podcast Los Tuluminatis — Emiliano Pineda Tuluminati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14;
    --panel:#12181f;
    --panel2:#0d1218;
    --border:#2a333d;
    --border-bright:#4a5866;
    --text:#E8E8E8;
    --dim:#7C8494;
    --lime:#C6FF3D;
    --magenta:#FF3DAE;
    --amber:#FFB400;
    --cyan:#3DE0FF;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ min-height:100%; }
  body{
    background: radial-gradient(ellipse 120% 90% at 50% 0%, #101825 0%, #0a0e14 55%, #060809 100%);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    position:relative;
    overflow-x:hidden;
    padding-bottom:90px;
  }
  .pixel{ font-family:'Press Start 2P', monospace; }
  a{ color:inherit; text-decoration:none; }

  .grid-bg{
    position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(rgba(198,255,61,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(198,255,61,0.03) 1px, transparent 1px);
    background-size:40px 40px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 20%, transparent 70%);
    animation: driftbg 22s ease-in-out infinite;
  }
  @keyframes driftbg{ 0%,100%{ background-position:0px 0px; } 50%{ background-position:14px -10px; } }
  @media (prefers-reduced-motion: reduce){ .grid-bg{ animation:none; } }

  .topbar{
    position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between;
    padding:20px 6vw; border-bottom:1px solid var(--border);
  }
  .back-link{
    display:flex; align-items:center; gap:8px; font-size:0.7rem; color:var(--dim);
    border:1px solid var(--border-bright); padding:8px 12px; transition:color .2s, border-color .2s;
  }
  .back-link:hover{ color:var(--lime); border-color:var(--lime); }
  .brand-mini{ font-size:0.62rem; color:var(--dim); letter-spacing:0.05em; }
  .brand-mini .blink{ display:inline-block; width:6px; height:11px; background:var(--lime); margin-left:4px; animation:blink 1s steps(1) infinite; vertical-align:middle;}
  @keyframes blink{ 50%{ opacity:0; } }

  .page-head{ position:relative; z-index:2; padding:56px 6vw 36px; max-width:820px; }
  .eyebrow{ font-size:0.65rem; color:var(--magenta); letter-spacing:0.1em; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--magenta); }
  .page-title{ font-size:clamp(2rem,6vw,3rem); line-height:1.1; margin-bottom:16px; }
  .page-lede{ font-size:0.95rem; color:var(--dim); line-height:1.6; max-width:520px; font-style:italic; }

  .player-wrap{ position:relative; z-index:2; padding:0 6vw; max-width:820px; margin:0 auto; }
  .player-frame{
    border:1px solid var(--border-bright); background:var(--panel2);
    aspect-ratio:16/9; overflow:hidden;
  }
  .player-frame iframe{ width:100%; height:100%; display:block; border:0; }

  .actions{ display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; }
  .action-btn{
    font-size:0.68rem; letter-spacing:0.04em; padding:12px 18px; border:1px solid var(--border-bright);
    color:var(--dim); display:inline-flex; align-items:center; gap:8px; transition:all .2s ease;
  }
  .action-btn:hover{ border-color:var(--magenta); color:var(--magenta); }

  .footnote{
    max-width:820px; margin:50px auto 0; padding:0 6vw; font-size:0.7rem; color:var(--dim); line-height:1.6;
  }
  .footnote .hl{ color:var(--amber); }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="topbar">
  <a href="index.html" class="back-link">← Volver</a>
  <div class="brand-mini pixel">TULUMINATI<span class="blink"></span></div>
</div>

<div class="page-head">
  <div class="eyebrow"><span class="dot"></span>PODCAST</div>
  <h1 class="page-title">Los Tuluminatis</h1>
  <p class="page-lede">Chekea el podcast, me mama hacer esto jajaja.</p>
</div>

<div class="player-wrap">
  <div class="player-frame">
    <iframe
      src="https://www.youtube.com/embed/videoseries?list=PLbsdKh9nnMRZ5nVt9Ye1cIC5NQUBJWPho"
      title="Podcast Los Tuluminatis — Playlist completa"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <div class="actions">
    <a class="action-btn" href="https://www.youtube.com/playlist?list=PLbsdKh9nnMRZ5nVt9Ye1cIC5NQUBJWPho" target="_blank" rel="noopener">Ver todos los episodios en YouTube →</a>
  </div>
</div>

<div class="footnote">
  🍿 Ve por palomitas y una Pepsi bien fría — esto se va a poner bien chicles bomba.
</div>

</body>
</html>
